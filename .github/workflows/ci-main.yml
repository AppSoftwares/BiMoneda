name: CI - BiMoneda Quality Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Type Check (TypeScript)
        run: pnpm exec tsc --noEmit
        
      - name: Build Web Production
        run: pnpm run build
        
      - name: Capacitor Sync Check
        run: npx cap sync
