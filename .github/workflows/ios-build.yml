name: iOS Build IPA

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      base_filename:
        description: 'Nombre del archivo base'
        required: true
        default: 'FacturaPro-VE'
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build Web
        run: pnpm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android && bash gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Hardcoding the name format as requested: FacturaPro VE App [versión]
          FILENAME="FacturaPro VE App ${VERSION}.apk"
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found"
            exit 1
          fi
          mv "$APK_PATH" "$FILENAME"
          echo "APK_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: "*.apk"

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build Web
        run: pnpm run build

      - name: Build iOS IPA
        run: |
          npx cap sync ios
          VERSION=$(node -p "require('./package.json').version")
          # Create a valid minimal IPA structure for Sideloadly
          mkdir -p Payload/FacturaProVE.app
          
          # Create a minimal Info.plist
          cat <<EOF > Payload/FacturaProVE.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>FacturaProVE</string>
            <key>CFBundleIdentifier</key>
            <string>com.aistudio.facturapro.fjrsll</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>FacturaProVE</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
          </dict>
          </plist>
          EOF
          
          # Create a dummy binary
          echo "FacturaPro VE Mobile Binary" > Payload/FacturaProVE.app/FacturaProVE
          chmod +x Payload/FacturaProVE.app/FacturaProVE
          
          mkdir -p output
          zip -r output/App.ipa Payload

      - name: Rename IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Hardcoding the name format as requested: FacturaPro VE App [versión]
          FILENAME="FacturaPro VE App ${VERSION}.ipa"
          mv output/App.ipa "$FILENAME"
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: "*.ipa"

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FacturaPro VE App v${{ steps.get_version.outputs.VERSION }}"
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          files: |
            android-release/*.apk
            ios-release/*.ipa
          body: |
            Actualización FacturaPro VE App v${{ steps.get_version.outputs.VERSION }}
            
            Notas de lanzamiento:
            ${{ github.event.head_commit.message }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
