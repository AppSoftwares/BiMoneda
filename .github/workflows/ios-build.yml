name: iOS Build IPA

on:
  workflow_dispatch:
    inputs:
      base_filename:
        description: 'Nombre del archivo base'
        required: true
        default: 'FacturaPro-VE'
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build Web
        run: pnpm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android && bash gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILENAME="${{ github.event.inputs.base_filename || 'FacturaPro VE App' }} ${VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$FILENAME"
          echo "APK_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: "*.apk"

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build Web
        run: pnpm run build

      - name: Build iOS IPA
        run: |
          npx cap sync ios
          # Placeholder for real IPA build
          mkdir -p output
          touch "output/App.ipa" 

      - name: Rename IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILENAME="${{ github.event.inputs.base_filename || 'FacturaPro VE App' }} ${VERSION}.ipa"
          mv output/App.ipa "$FILENAME"
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: "*.ipa"

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FacturaPro VE App v${{ steps.get_version.outputs.VERSION }}"
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          files: |
            android-release/*.apk
            ios-release/*.ipa
          body: |
            Actualización FacturaPro VE App v${{ steps.get_version.outputs.VERSION }}
            
            Notas de lanzamiento:
            ${{ github.event.head_commit.message }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
