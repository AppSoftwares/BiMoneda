<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="55%" stop-color="#123A63"/>
      <stop offset="100%" stop-color="#1C5C8C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4CA6E"/>
      <stop offset="100%" stop-color="#C99A32"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F5F9"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#04122A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo cuadrado (el sistema operativo aplica su propia mascara) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Documento / Factura -->
  <g filter="url(#softShadow)">
    <path d="M156 96 H304 L356 148 V416 A14 14 0 0 1 342 430 H156 A14 14 0 0 1 142 416 V110 A14 14 0 0 1 156 96 Z" fill="url(#paperGrad)"/>
    <path d="M304 96 L356 148 H316 A12 12 0 0 1 304 136 Z" fill="#D8E1EC"/>
  </g>

  <rect x="178" y="176" width="130" height="14" rx="7" fill="#0B2545" opacity="0.85"/>
  <rect x="178" y="206" width="150" height="10" rx="5" fill="#5A7396"/>
  <rect x="178" y="228" width="150" height="10" rx="5" fill="#5A7396"/>
  <rect x="178" y="250" width="110" height="10" rx="5" fill="#5A7396"/>

  <rect x="178" y="288" width="150" height="1.5" fill="#C7D2E0"/>
  <rect x="178" y="306" width="150" height="10" rx="5" fill="#93A6C0"/>
  <rect x="178" y="328" width="90" height="10" rx="5" fill="#93A6C0"/>

  <rect x="178" y="362" width="150" height="1.5" fill="#C7D2E0"/>
  <rect x="228" y="380" width="100" height="16" rx="8" fill="url(#goldGrad)"/>

  <g transform="translate(352,352)">
    <circle cx="0" cy="0" r="78" fill="url(#goldGrad)" filter="url(#softShadow)"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>

    <path d="M -40 -14 A 46 46 0 0 1 34 -34" fill="none" stroke="#0B2545" stroke-width="9" stroke-linecap="round"/>
    <polygon points="34,-34 16,-40 26,-20" fill="#0B2545"/>

    <path d="M 40 14 A 46 46 0 0 1 -34 34" fill="none" stroke="#0B2545" stroke-width="9" stroke-linecap="round"/>
    <polygon points="-34,34 -16,40 -26,20" fill="#0B2545"/>

    <text x="0" y="-2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#0B2545">$</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#0B2545">Bs</text>
  </g>
</svg>
